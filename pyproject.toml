[project]
name = "python-ai-template"
version = "0.1.0"
description = "Python project template for AI-agent-assisted development"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-ai-template = "python_ai_template.__main__:main"
check_quality = "scripts.quality:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_ai_template", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "ty>=0.0.1,<1",
    "wemake-python-styleguide>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
external = ["WPS"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
unsound-return-statement = "error"
