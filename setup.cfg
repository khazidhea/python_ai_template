[flake8]
max-line-length = 120
max-complexity = 6

max-imports = 13
max-import-from-members = 14
max-raises = 5
max-cognitive-score = 11
max-try-body-length = 5
max-module-members = 20
max-local-variables = 9
max-function-expressions = 5
max-name-length = 60
max-methods = 4

select = B,C,E,F,W,WPS,B9
ignore =
    W503

per-file-ignores =
    tests/*: WPS100, WPS110, WPS114, WPS118, WPS201, WPS211, WPS202, WPS203, WPS204, WPS210, WPS214, WPS217, WPS218, WPS219, WPS221, WPS226, WPS235, WPS237, WPS347, WPS358, WPS359, WPS407, WPS420, WPS430, WPS432, WPS437, WPS459, WPS460
